###############改名字##############
name: validate-490m-config

# 只验证配置，不编译：
#   1) 展开 buildroot .config，断言 BTF 全套符号真实生效（defconfig 会静默丢掉不满足依赖的符号）
#   2) 用源码树自己的传递规则（include/kernel-defaults.mk 的 awk）复刻内核目标配置，
#      断言 CONFIG_DEBUG_INFO_BTF=y 会真的传到内核
#
# 为什么不用 make target/linux/configure：该目标在本树只解压内核源码、不产出内核 .config
# （2026-11-20 实测：linux-6.12.116 目录存在但无 .config）。内核 .config 只在真正编译内核时
# 由 Kernel/Configure 生成，故改用同一条 awk 规则做等价验证。
#
# 通过后再去跑完整编译（redmi-ax6000-chasey-25.12-490m）。

on:
  workflow_dispatch:
  push:
    paths:
      - 'redmi-ax6000/chasey-25.12-490m/config/default.config'
      - '.github/workflows/validate-490m-config.yml'

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git
  REPO_BRANCH: 25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: redmi-ax6000/chasey-25.12-490m/config/default.config
  DIY_P1_SH: redmi-ax6000/chasey-25.12-490m/diy/diy-part1.sh
  DIY_P2_SH: redmi-ax6000/chasey-25.12-490m/diy/diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
    - name: 检查项目分支
      uses: actions/checkout@v4

    - name: 安装所需依赖
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq --no-install-recommends install \
          build-essential bc ca-certificates file flex gawk gettext git \
          libelf-dev libncurses-dev python3 rsync unzip wget zlib1g-dev
        sudo timedatectl set-timezone "$TZ" || true

    - name: 下载固件源码
      run: |
        sudo mkdir -p /workdir && sudo chown $USER:$GROUPS /workdir
        git clone -b $REPO_BRANCH --single-branch --depth 1 $REPO_URL /workdir/openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 加载feeds.conf.default & DIY_P1_SH
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新 & 安装 feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 加载config & DIY_P2_SH
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 展开配置（只 defconfig，不编译）
      run: |
        cd openwrt
        make defconfig
        cp .config $GITHUB_WORKSPACE/expanded.config

    - name: 断言一：buildroot 层 BTF 全套生效
      run: |
        fail=0
        for s in \
          "CONFIG_KERNEL_DEBUG_INFO=y" \
          "CONFIG_KERNEL_DEBUG_INFO_BTF=y" \
          "CONFIG_KERNEL_MODULE_ALLOW_BTF_MISMATCH=y" \
          "CONFIG_KERNEL_KPROBES=y" \
          "CONFIG_KERNEL_BPF_EVENTS=y" \
          "CONFIG_PACKAGE_kmod-sched-bpf=y" \
          "CONFIG_PACKAGE_kmod-veth=y" \
        ; do
          grep -qxF "$s" expanded.config || { echo "MISSING: $s"; fail=1; }
        done
        grep -qxF "# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set" expanded.config \
          || { echo "MISSING: REDUCED 必须关（BTF depends on !REDUCED）"; fail=1; }
        # BTF 由 pahole 生成：KERNEL_DEBUG_INFO_BTF select DWARVES，必须编进来
        grep -qE "^CONFIG_(DWARVES|PACKAGE_dwarves)=y" expanded.config \
          || { echo "MISSING: DWARVES/pahole 未启用，BTF 生成会失败"; fail=1; }
        [ "$fail" -eq 0 ] || { echo "== buildroot 断言失败 =="; exit 1; }
        echo "buildroot 断言通过"

    - name: 断言二：内核侧会拿到 BTF（用树自己的传递规则）
      run: |
        cd openwrt
        # 1) 确认这棵树确实用 awk 把 CONFIG_KERNEL_* 转成内核 CONFIG_*
        grep -qF 'sub("CONFIG_KERNEL_","CONFIG_")' include/kernel-defaults.mk \
          || { echo "这棵树的 Kernel/Configure 传递规则变了，需重新核对"; exit 1; }
        echo "传递机制存在：include/kernel-defaults.mk"

        # 2) 用同一条 awk 规则，从展开后的 buildroot .config 复刻内核目标配置
        awk '/^(#[[:space:]]+)?CONFIG_KERNEL/{sub("CONFIG_KERNEL_","CONFIG_");print}' \
          .config > /tmp/kernel.target
        cp /tmp/kernel.target $GITHUB_WORKSPACE/kernel.target

        echo "=== 复刻出的内核对 BTF 相关行 ==="
        grep -E "DEBUG_INFO|_BTF" /tmp/kernel.target || echo "(no match)"

        fail=0
        grep -qxF "CONFIG_DEBUG_INFO=y" /tmp/kernel.target \
          || { echo "MISSING: 内核 CONFIG_DEBUG_INFO=y"; fail=1; }
        grep -qxF "CONFIG_DEBUG_INFO_BTF=y" /tmp/kernel.target \
          || { echo "MISSING: 内核 CONFIG_DEBUG_INFO_BTF=y —— 刷了 daed 也起不来"; fail=1; }
        grep -qxF "# CONFIG_DEBUG_INFO_REDUCED is not set" /tmp/kernel.target \
          || { echo "MISSING: 内核 DEBUG_INFO_REDUCED 必须关"; fail=1; }
        [ "$fail" -eq 0 ] || { echo "== 内核传递断言失败 =="; exit 1; }

        # 3) 确认内核源码已能解压（证明 prepare 链路通，不是空目录糊弄）
        make target/linux/prepare -j$(nproc) V=s >/dev/null 2>&1 || true
        KDIR=$(find build_dir -maxdepth 3 -type d -name "linux-6.12*" | head -n 1)
        [ -n "$KDIR" ] || { echo "内核源码未解压，prepare 链路有问题"; exit 1; }
        echo "内核源码目录：$KDIR"
        echo "内核传递断言通过，可以去跑完整编译了"

    - name: 上传验证产物
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: 490m-config-check
        path: |
          expanded.config
          kernel.target
        retention-days: 7

    - name: 回写证据到 diag 分支
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cd openwrt
        {
          echo "run=$GITHUB_RUN_ID sha=$GITHUB_SHA"
          echo
          echo "### 1. buildroot 展开配置（BTF 相关）"
          grep -E "DEBUG_INFO|_BTF|KPROBES|BPF_EVENTS|SCHED_BPF|VETH|DWARVES" "$GITHUB_WORKSPACE/expanded.config" || echo "(missing)"
          echo
          echo "### 2. 传递机制（kernel-defaults.mk）"
          grep -F 'CONFIG_KERNEL_","CONFIG_' include/kernel-defaults.mk || echo "(missing)"
          echo
          echo "### 3. 复刻出的内核目标配置（BTF 相关）"
          grep -E "DEBUG_INFO|_BTF" /tmp/kernel.target 2>/dev/null || echo "(missing)"
          echo
          echo "### 4. 内核源码目录"
          find build_dir -maxdepth 3 -type d -name "linux-6.12*" 2>/dev/null || echo "(none)"
        } > /tmp/diag.txt 2>&1 || true
        cd "$GITHUB_WORKSPACE"
        git fetch origin diag --depth 1 2>/dev/null || true
        git checkout -B diag 2>/dev/null || git branch diag
        cp /tmp/diag.txt diag.txt
        git add -f diag.txt
        git -c user.name=validate-bot -c user.email=validate-bot@local commit -m "diag $GITHUB_RUN_ID" || true
        git push origin diag --force
